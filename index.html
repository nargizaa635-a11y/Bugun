<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5B4BDB">
  <meta name="description" content="Bugun — katta maqsadni bugungi kichik qadamga aylantiradigan bepul platforma.">
  <title>Bugun</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Bugun bosh sahifa">
        <span class="brand-mark">B</span><span>bugun</span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" data-action="toggle-theme" aria-label="Tungi rejim" title="Tungi rejim">◐</button>
        <button class="avatar" data-action="profile" aria-label="Profil">?</button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>Bugun</small></button>
      <button data-nav="plan" class="nav-item"><span>✓</span><small>Reja</small></button>
      <button data-nav="progress" class="nav-item"><span>◔</span><small>Natija</small></button>
      <button data-nav="profile" class="nav-item"><span>◎</span><small>Profil</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="restore-file" type="file" accept="application/json" hidden>
  <div id="modal" class="modal" aria-hidden="true"></div>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(err => console.warn("Offline rejimi yoqilmadi:", err)));
    }
  </script>
</body>
</html>
